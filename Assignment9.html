<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #2575fc;
            outline: none;
            box-shadow: 0 0 5px rgba(37,117,252,0.5);
        }

        /* Radio & Checkbox spacing */
        .inline {
            width: auto;
            margin-right: 10px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            justify-content: space-between;
        }

        input[type="submit"] {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        input[type="reset"] {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background: #218838;
        }

        input[type="reset"]:hover {
            background: #c82333;
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Employee Registration Form</h2>

    <form>
        <label>Full Name:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <label>Gender:</label><br>
        <input type="radio" name="gender" class="inline"> Male
        <input type="radio" name="gender" class="inline"> Female
        <input type="radio" name="gender" class="inline"> Other
        <br><br>

        <label>Department:</label>
        <select name="department">
            <option>HR</option>
            <option>IT</option>
            <option>Finance</option>
            <option>Marketing</option>
        </select>

        <label>Skills:</label><br>
        <input type="checkbox" class="inline"> Java
        <input type="checkbox" class="inline"> Python
        <input type="checkbox" class="inline"> C++
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">

        <label>Address:</label>
        <textarea rows="3"></textarea>

        <label>Upload Resume:</label>
        <input type="file">

        <div class="btn-group">
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </div>
    </form>
</div>

</body>
</html>
