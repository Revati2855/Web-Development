<!DOCTYPE html>
<html>
<head>
    <title>HTML List Tags Example</title>
</head>
<body>

    <h2>1. Ordered List (Numbered)</h2>
    <ol>
        <li>Java</li>
        <li>Python</li>
        <li>C++</li>
    </ol>

    <h2>2. Unordered List (Bulleted)</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>

    <h2>3. Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>

        <dt>JS</dt>
        <dd>JavaScript</dd>
    </dl>

</body>
</html>
